# 本文件只保留此部署实际使用的 CLIProxyAPI v7 配置。
# 完整的最新字段参考：
# https://github.com/router-for-me/CLIProxyAPI/blob/main/config.example.yaml

host: ""
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  # Docker 端口默认只绑定宿主机 127.0.0.1。确需远程管理时，再同时设置此项和强密码。
  allow-remote: false
  secret-key: ""
  disable-control-panel: false
  disable-auto-update-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# Compose 将宿主机 ./cliproxyapi/oa 挂载到此目录。
# 登录命令写入的 JSON 凭证会被服务热加载，且不会进入 Git 或镜像。
auth-dir: "/data/auth"

# 调用代理 API 时使用的 Bearer Key。复制本文件后务必更换。
api-keys:
  - "change-this-api-key"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

plugins:
  enabled: false
  dir: "/CLIProxyAPI/plugins"
  configs: {}

commercial-mode: false
logging-to-file: false
logs-max-total-size-mb: 0
error-logs-max-files: 10
usage-statistics-enabled: false
redis-usage-queue-retention-seconds: 60

# 留空时继承 HTTP_PROXY/HTTPS_PROXY；可选 sing-box override 会自动注入这些环境变量。
proxy-url: ""
force-model-prefix: false
passthrough-headers: false

request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
disable-cooling: false
save-cooldown-status: false
transient-error-cooldown-seconds: 0

# Claude/Codex/xAI compatibility defaults from the current upstream main config.
disable-claude-cloak-mode: false

claude-code:
  disable-cloaking-model-list: false

disable-image-generation: false
video-result-auth-cache-ttl: "3h"

quota-exceeded:
  switch-project: true
  switch-preview-model: true
  antigravity-credits: true

routing:
  strategy: "round-robin"
  session-affinity: false
  session-affinity-ttl: "1h"

codex:
  identity-confuse: false
  disable-codex-cloaking: false
  optimize-multi-agent-v2: false
  live-media-relay:
    enabled: false
    max-sessions: 32
    disable-private-remote-ips: false
    public-ip: ""
    udp-port-min: 0
    udp-port-max: 0

xai:
  inject-x-search: false

# 上游当前示例默认开启 WebSocket API 认证。
ws-auth: true
nonstream-keepalive-interval: 0

streaming:
  keepalive-seconds: 15
  bootstrap-retries: 1
