name: Check dev-runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - run: git diff --exit-code -- internal/web/dist
      - run: make test build
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: make ui-test
      - run: make integration ENGINE=docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: web/test-results
  linux-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -tags 'remote containers_image_openpgp' -o "dist/dev-runtime-linux-$arch" ./cmd/dev-runtime
          done
          cd dist
          sha256sum dev-runtime-linux-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dev-runtime-linux
          path: dist/
