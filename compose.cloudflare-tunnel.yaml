services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.3}
    profiles: ["cloudflare-tunnel"]
    restart: unless-stopped
    environment:
      # cloudflared 官方支持 TUNNEL_TOKEN；值来自权限为 0600 的 .env。
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    command: ["tunnel", "--metrics", "0.0.0.0:2000", "run"]
    depends_on:
      cli-proxy-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
