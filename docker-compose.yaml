services:
  new-api:
    image: ${NEW_API_IMAGE:-docker.io/calciumion/new-api:v0.13.2}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Taipei}
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?Run new-api-runtime init first}
      SQLITE_PATH: /data/new-api.db
      ERROR_LOG_ENABLED: "true"
      GIN_MODE: release
    ports:
      - "${NEW_API_BIND_ADDRESS:-127.0.0.1}:${NEW_API_PORT:-23000}:3000"
    volumes:
      - ${NEW_API_DATA_DIR:?Run new-api-runtime init first}:/data
    logging:
      options:
        max-size: "16m"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/status || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
